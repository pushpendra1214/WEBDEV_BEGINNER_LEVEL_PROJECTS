<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CG PET Entrance Exam Application Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #003366;
    }

    form {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    input[type="submit"] {
      background-color: #004080;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      font-size: 16px;
    }

    input[type="submit"]:hover {
      background-color: #002b5c;
    }
  </style>
</head>
<body>

  <h2> Entrance Exam Application Form</h2>

  <form action="submit_cgpet.php" method="POST" enctype="multipart/form-data">
    <label for="name">Candidate Full Name:</label>
    <input type="text" id="name" name="fullname" required>

    <label for="fathername">Father's Name:</label>
    <input type="text" id="fathername" name="fathername" required>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
      <option value="">--Select--</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="category">Category:</label>
    <select id="category" name="category" required>
      <option value="">--Select--</option>
      <option value="General">General</option>
      <option value="OBC">OBC</option>
      <option value="SC">SC</option>
      <option value="ST">ST</option>
    </select>

    <label for="domicile">Do you have Chhattisgarh Domicile?</label>
    <select id="domicile" name="domicile" required>
      <option value="">--Select--</option>
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Mobile Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="address">Permanent Address:</label>
    <textarea id="address" name="address" rows="3" required></textarea>

    <label for="examCenter">Preferred Exam Center:</label>
    <select id="examCenter" name="exam_center" required>
      <option value="">--Select--</option>
      <option value="Raipur">Raipur</option>
      <option value="Bilaspur">Bilaspur</option>
      <option value="Durg">Durg</option>
      <option value="Jagdalpur">Jagdalpur</option>
      <option value="Ambikapur">Ambikapur</option>
    </select>

    <label for="board">12th Board Name:</label>
    <input type="text" id="board" name="board" required>


    <label for="marks">12th Marks Percentage:</label>
    <input type="number" id="marks" name="marks" min="0" max="100" step="0.1" required>
 <label for="photo">12th  certificate (JPG/Pdf):</label>
    <input type="file" id="photo" name="photo" accept=\"image/*\" 
required>

    <label for="photo">Domicil certificate (JPG/Pdf):</label>
    <input type="file" id="photo" name="photo" accept=\"image/*\" 
required>

<label for="photo">Cast certificate (JPG/Pdf):</label>
    <input type="file" id="photo" name="photo" accept=\"image/*\" required>


<label for="photo">Any govt. certified ID card (JPG/pdf):</label>
    <input type="file" id="photo" name="photo" accept=\"image/*\" required>

     <label for="photo">Upload Passport Size Photo (JPG/PNG):</label>
    <input type="file" id="photo" name="photo" accept=\"image/*\" required>

    <label for="signature">Upload Signature (JPG/PNG):</label>
    <input type="file" id="signature" name="signature" accept=\"image/*\" required>
<br>

<b>Generate username and profile password</b>

<label for="username">Username:</label>
    <input type="text" id="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" required>

    <input type="submit" value="Submit Application">
  </form>

</body>
</html>
