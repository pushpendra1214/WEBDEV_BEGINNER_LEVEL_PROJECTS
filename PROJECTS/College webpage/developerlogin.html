<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Sign-In | College Portal</title>
    <style>
        /* * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        } */

        .developer-login {
             height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
            background: linear-gradient(135deg, #090909, #0b3049);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 35px;
            width: 380px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            background: linear-gradient(135deg, #f0f0f0, #2593dc);
        }

        .login-box h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-box p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #0e0d0d;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #090808;
            outline: none;
        }

        .login-box input::placeholder {
            color: #131212;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: linear-gradient(90deg, #0072ff, #00c6ff);
        }

        .extra-links {
            margin-top: 15px;
        }

        .extra-links a {
            color: #00c6ff;
            text-decoration: none;
            font-size: 14px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .logo {
            width: 80px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="developer-login">

        <div class="login-box">
            <!-- <img src="https://cdn-icons-png.flaticon.com/512/3523/3523063.png" alt="Dev Logo" class="logo"> -->
            <h2>Developer Login</h2>
            <p>Access the College Development Portal</p>
            <form>
                <input type="text" placeholder="Developer Username or Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="login-btn"> Logn</button>
            </form>
            <div class="extra-links">
                <!-- <p><a href="#">Forgot Password?</a> | <a href="#">Contact Admin</a></p> -->
            </div>
        </div>
    </div>
</body>

</html>
