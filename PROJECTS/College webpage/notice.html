<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Notice Board</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f8ff;
        }

        h2 {
            text-align: center;
            color: #003366;
            margin: 20px 0 10px;
        }

        .notice-board {
            width: 100%;
            max-width: 600px;
            height: 550px;
            /* adjust height */
            margin: auto;
            background-color: #003366;
            color: white;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 10px 0;
            position: relative;
        }


        .notice-container {
            display: flex;
            flex-direction: column;
            animation: scroll-up 12s linear infinite;
        }

        .notice-board a {
            color: #ffcc00;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 10px 20px;
        }

        .notice-container:hover {
            animation-play-state: paused;
        }

        .notice-board a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @keyframes scroll-up {
            0% {
                transform: translateY(100%);
            }

            100% {
                transform: translateY(-100%);
            }
        }
    </style>
</head>
