<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Member logIn</title>
    <style>
        /* * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    } */
        .departmentLogin {
       
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #090909, #0b3049);
    }
        .login-container {
            background: #fff;
            padding: 35px;
            width: 380px;
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            text-align: center;
            background: linear-gradient( 135deg, #f0f0f0, #2593dc);
            /* visibility: hidden; */
        }

        .login-container img {
            width: 80px;
            margin-bottom: 10px;
        }

        .login-container h2 {
            margin-bottom: 5px;
            color: #333;
        }

        .login-container p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #0066cc;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #004c99;
        }

        .extra-links {
            margin-top: 15px;
        }

        .extra-links a {
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="departmentLogin">
        <div class="login-container">
            <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/OOjs_UI_icon_academic.svg/1200px-OOjs_UI_icon_academic.svg.png" alt="College Logo"> -->
            <h2>Department login</h2>
            <p>For Authorized Faculty & Staff Only</p>
            <form>
                <input type="email" placeholder="Department Memberr Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="login-btn">log In</button>
            </form>
            <div class="extra-links">
                <p><a href="#">Forgot Password?</a></p> <a href="#">Contact Admin</a></p>

            </div>
        </div>
    </div>
</body>

</html>
