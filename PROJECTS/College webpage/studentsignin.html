<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Student Sign-In</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    body {
        
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #090909, #0b3049);
        
    }
    .signin-container {
        background: #fff;
        padding: 40px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        text-align: center;
        background: linear-gradient( 135deg, #f0f0f0, #2593dc);
    }
    .signin-container h2 {
        margin-bottom: 20px;
        color: #333;
    }
    .signin-container input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }
    .signin-btn {
        width: 100%;
        padding: 12px;
        background: #4e73df;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }
    .signin-btn:hover {
        background: #2e59d9;
    }
    .extra-links {
        margin-top: 15px;
    }
    .extra-links a {
        color: #4e73df;
        text-decoration: none;
        font-size: 14px;
    }
    .extra-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<div class="signin-container">
    <h2>Student Sign-In</h2>
    <form>
        <input type="email" placeholder="Student Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="signin-btn">Sign In</button>
    </form>
    <div class="extra-links">
        <p><a href="#">Forget Password?</a></p>
        <p><a href="#">Create an Account</a></p>
    </div>
</div>

</body>
</html>
