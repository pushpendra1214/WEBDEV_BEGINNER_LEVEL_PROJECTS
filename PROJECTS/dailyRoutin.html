<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Daily Routine Worksheet</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f7f7f7;
        border-color: #333;
    }
    h1 {
        text-align: center;
        color: #333;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
    }
    th, td {
        border: 1px solid #ccc;
        text-align: center;
        padding: 10px;
        border-radius: 20px;
    }
    th {
        background-color: #efbc30;
        color: white;
    }
    input[type="text"] {
        width: 90%;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-align: center;
    }
    .btn-container {
        text-align: center;
        margin-top: 15px;
    }
    .btn-container button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 5px;
        cursor: pointer;
        border: 2px solid #45a049;
        border-radius: 5px;
        background-color: #19314d;
        color: white;
    }
    .btn-container button:hover {
        background-color: #45a049;
    }

    form{
        
        padding-top: 100px;
        border-bottom: dotted 5px #831313;
        
    }
</style>
</head>
<body>

<h1>Student Daily Routine Worksheet</h1>

<form>
    <table>
        <tr>
            <th>Week Day</th>
            <th>6 AM - 7 AM</th>
            <th>7 AM - 8 AM</th>
            <th>8 AM - 9 PM</th>
            <th>9 PM - 10 PM</th>
            <th>2 PM - 4 PM</th>
            <th>4 PM - 6 PM</th>
            <th>6 PM - 8 PM</th>
            <th>8 PM - 10 PM</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td><input type="text" name="mon_6_8"></td>
            <td><input type="text" name="mon_8_10"></td>
            <td><input type="text" name="mon_10_12"></td>
            <td><input type="text" name="mon_12_2"></td>
            <td><input type="text" name="mon_2_4"></td>
            <td><input type="text" name="mon_4_6"></td>
            <td><input type="text" name="mon_6_8pm"></td>
            <td><input type="text" name="mon_8_10pm"></td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td><input type="text" name="tue_6_8"></td>
            <td><input type="text" name="tue_8_10"></td>
            <td><input type="text" name="tue_10_12"></td>
            <td><input type="text" name="tue_12_2"></td>
            <td><input type="text" name="tue_2_4"></td>
            <td><input type="text" name="tue_4_6"></td>
            <td><input type="text" name="tue_6_8pm"></td>
            <td><input type="text" name="tue_8_10pm"></td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td><input type="text" name="wed_6_8"></td>
            <td><input type="text" name="wed_8_10"></td>
            <td><input type="text" name="wed_10_12"></td>
            <td><input type="text" name="wed_12_2"></td>
            <td><input type="text" name="wed_2_4"></td>
            <td><input type="text" name="wed_4_6"></td>
            <td><input type="text" name="wed_6_8pm"></td>
            <td><input type="text" name="wed_8_10pm"></td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td><input type="text" name="wed_6_8"></td>
            <td><input type="text" name="wed_8_10"></td>
            <td><input type="text" name="wed_10_12"></td>
            <td><input type="text" name="wed_12_2"></td>
            <td><input type="text" name="wed_2_4"></td>
            <td><input type="text" name="wed_4_6"></td>
            <td><input type="text" name="wed_6_8pm"></td>
            <td><input type="text" name="wed_8_10pm"></td>
        </tr>
<tr>
            <td>Friday</td>
            <td><input type="text" name="wed_6_8"></td>
            <td><input type="text" name="wed_8_10"></td>
            <td><input type="text" name="wed_10_12"></td>
            <td><input type="text" name="wed_12_2"></td>
            <td><input type="text" name="wed_2_4"></td>
            <td><input type="text" name="wed_4_6"></td>
            <td><input type="text" name="wed_6_8pm"></td>
            <td><input type="text" name="wed_8_10pm"></td>
        </tr>
<tr>
            <td>Saturday</td>
            <td><input type="text" name="wed_6_8"></td>
            <td><input type="text" name="wed_8_10"></td>
            <td><input type="text" name="wed_10_12"></td>
            <td><input type="text" name="wed_12_2"></td>
            <td><input type="text" name="wed_2_4"></td>
            <td><input type="text" name="wed_4_6"></td>
            <td><input type="text" name="wed_6_8pm"></td>
            <td><input type="text" name="wed_8_10pm"></td>
        </tr>
    </table>

    <div class="btn-container">
        <button type="reset">Clear All</button>
        <button type="submit">Save Routine</button>
    </div>
</form>

</body>
</html>
